# http://www.drbunsen.org/the-text-triumvirate/
# https://hackernoon.com/a-gentle-introduction-to-tmux-8d784c404340

set -g default-terminal "screen-256color"

set -g default-command "reattach-to-user-namespace -l zsh"

set -g mouse on

# Copy mode
setw -g mode-keys vi
bind ` copy-mode
unbind [
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind y run "tmux save-buffer - | reattach-to-user-namespace pbcopy"

# ---- status line ----

set -g status-interval 5
set -g status-justify left

# Widen the left segment: the stock 10 columns truncate both the session name
# and the flags appended below.
set -g status-left-length 60
set -g status-right-length 80

set -g status-style 'bg=green,fg=black'

# Session name, then prefix and copy-mode indicators. #{?...} emits the marker
# only while that state holds, so the segment stays quiet during normal work.
set -g status-left "[#S]#{?client_prefix, ^B,}#{?pane_in_mode, COPY,} "

# Window list: index, name, and the flags tmux already tracks
# (* current, - last, ! bell, # activity, Z zoomed).
setw -g window-status-format "#I:#W#F"
setw -g window-status-current-format "#I:#W#F"
setw -g window-status-current-style 'bg=black,fg=green,bold'
setw -g window-status-bell-style 'bg=red,fg=white,bold'
setw -g window-status-activity-style 'bg=green,fg=black,bold'

# Report bells and output from inactive windows, which the flags above display.
setw -g monitor-activity on
setw -g monitor-bell on
set -g visual-activity off
set -g visual-bell off

# Pane position, directory, git branch, host, time.
set -g status-right "#{pane_index}/#{window_panes}  #{b:pane_current_path}  #(~/.tmux/git-status.sh '#{pane_current_path}')  #h  %H:%M"
